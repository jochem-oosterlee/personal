# Push naar main -> image bouwen -> uitrollen naar Cloud Run.
#
# De service houdt zijn bestaande instellingen (IAP aan, geen anonieme
# toegang); die staan hier bewust niet, zodat een deploy ze niet stilletjes
# kan overschrijven.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - COMMIT_SHA=$SHORT_SHA
      - -t
      - $_IMAGE
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, $_IMAGE]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - personal
      - --image=$_IMAGE
      - --region=europe-west4
      - --quiet

substitutions:
  _IMAGE: europe-west4-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/personal:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
