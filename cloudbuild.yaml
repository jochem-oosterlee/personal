# Push naar main -> image bouwen -> uitrollen naar Cloud Run.
#
# De service houdt zijn bestaande instellingen (IAP aan, geen anonieme
# toegang); die staan hier bewust niet, zodat een deploy ze niet stilletjes
# kan overschrijven.
#
# Het image-pad staat voluit in elke stap. In een eigen substitutie zetten
# werkt niet: de waarde daarvan wordt niet nog eens uitgevouwen, waardoor
# $PROJECT_ID letterlijk in de tag belandt.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - COMMIT_SHA=$SHORT_SHA
      - -t
      - europe-west4-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/personal:$SHORT_SHA
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west4-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/personal:$SHORT_SHA

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - personal
      - --image=europe-west4-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/personal:$SHORT_SHA
      - --region=europe-west4
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY
