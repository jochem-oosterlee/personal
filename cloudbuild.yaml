# App bouwen en uitrollen. Wijzigt er alleen iets onder agent/, dan slaat de
# trigger deze build over — zie cloudbuild.agent.yaml.
#
# Het image-pad staat voluit in elke stap. In een eigen substitutie zetten
# werkt niet: de waarde daarvan wordt niet nog eens uitgevouwen, waardoor
# $PROJECT_ID letterlijk in de tag belandt.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - COMMIT_SHA=$SHORT_SHA
      - -t
      - europe-west4-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/personal:$SHORT_SHA
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west4-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/personal:$SHORT_SHA

  # De service-instellingen (IAP, geen anonieme toegang) staan hier bewust
  # niet: die zijn eenmalig gezet en een deploy mag ze niet overschrijven.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - personal
      - --image=europe-west4-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/personal:$SHORT_SHA
      - --region=europe-west4
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
