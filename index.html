<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f1e7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Personal" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <title>Personal</title>
    <script>
      // Resolve the theme before first paint so there is no light flash.
      // useTheme() takes over from here and keeps this in sync.
      ;(function () {
        var stored
        try {
          stored = JSON.parse(localStorage.getItem('personal:settings.theme'))
        } catch (error) {
          stored = null
        }
        var dark =
          stored === 'dark' ||
          ((stored === 'system' || !stored) &&
            matchMedia('(prefers-color-scheme: dark)').matches)

        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#15130f' : '#f6f1e7')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
