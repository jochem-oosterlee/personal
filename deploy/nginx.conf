server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Zonder dit maakt nginx van een relatieve redirect een absolute met $host en
  # de interne poort: http://…run.app:8080/. Achter Cloud Run is dat het
  # verkeerde schema en een onbereikbare poort, en gebeurt er in de browser
  # niets — een stille fout, lokaal geverifieerd.
  absolute_redirect off;
  port_in_redirect off;

  # Herstelroute na een verlopen IAP-sessie. De service worker laat alles onder
  # /__ met rust (navigateFallbackDenylist), dus deze navigatie gaat echt het
  # netwerk op en komt daarmee langs IAP.
  location = /__auth {
    return 302 "/";
  }

  # Sonde om te bepalen of de sessie nog geldig is. Geldig -> 204. Verlopen ->
  # IAP onderschept dit en stuurt een 302 naar accounts.google.com, wat een
  # fetch met redirect:'manual' als opaqueredirect terugkrijgt.
  location = /__session {
    add_header Cache-Control "no-store" always;
    return 204;
  }

  # Gehashte bestandsnamen, dus onbeperkt cachebaar.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Deze twee bepalen of je een update ziet; nooit uit de HTTP-cache serveren.
  location = /sw.js {
    add_header Cache-Control "no-store" always;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
