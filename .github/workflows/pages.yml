# Bouwt en publiceert naar GitHub Pages. Wordt zelf niet getriggerd, maar
# aangeroepen door deploy.yml (push naar main) en door claude.yml (na een
# auto-merge, omdat een merge met GITHUB_TOKEN geen push-event afvuurt dat
# workflows start).
name: Pages

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
