# Bouwt en publiceert naar GitHub Pages. Wordt zelf niet getriggerd, maar
# aangeroepen door deploy.yml (push naar main) en door claude.yml (na een
# auto-merge, omdat een merge met GITHUB_TOKEN geen push-event afvuurt dat
# workflows start).
name: Pages

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Git-ref om te bouwen. Leeg betekent de commit die de run startte —
          goed voor een push, maar fout na een merge binnen dezelfde run:
          die commit is dan nog van vóór de merge.
        type: string
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Standaard tien minuten. Pages haalt dat soms niet, waarna de job
          # rood wordt terwijl de site wél is bijgewerkt — een rode run die
          # eigenlijk slaagde is erger dan een trage.
          timeout: 1800000
