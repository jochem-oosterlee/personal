name: Claude bouwt de wens

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Nummer van de issue die Claude moet oppakken
        required: true

# Eén run per issue; een tweede push wacht in plaats van parallel te draaien.
concurrency:
  group: claude-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  build-wish:
    # Alleen wensen van de eigenaar zelf, en alleen met het label uit de PWA.
    # Zonder deze guard kan iedere GitHub-gebruiker die een issue kan labelen
    # een Claude-run starten op jouw rekening.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'enhancement' &&
       github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # De app zet "Model: <id>" in de issue-body. Die waarde komt van buiten
      # en gaat een CLI-argument in, dus hij wordt niet doorgegeven maar
      # gematcht: alles wat niet in deze lijst staat valt terug op de default.
      - name: Model bepalen
        id: model
        run: |
          requested=$(gh issue view "$ISSUE" --json body --jq '.body' \
            | sed -n 's/^Model: \([A-Za-z0-9.-]\{1,40\}\)[[:space:]]*$/\1/p' \
            | head -n1)

          case "${requested}" in
            claude-opus-5|claude-sonnet-5|claude-haiku-4-5) model="${requested}" ;;
            '') model=claude-opus-5 ;;
            *)
              model=claude-opus-5
              echo "::warning::Onbekend model '${requested}' in issue #${ISSUE}; ${model} gebruikt."
              ;;
          esac

          echo "model=${model}" >> "$GITHUB_OUTPUT"
          echo "Bouwen met ${model}."

      - uses: anthropics/claude-code-action@v1
        with:
          # Draait op het Claude-abonnement in plaats van op API-facturering.
          # Terug naar de API: vervang deze regel door
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Beide tegelijk zetten kan wel, maar dan is niet te zien welke wint
          # en betaal je mogelijk stil door op de API.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          claude_args: |
            --model ${{ steps.model.outputs.model }}
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(npm:*)"
          prompt: |
            Lees issue #${{ github.event.issue.number || inputs.issue }} met
            `gh issue view` en implementeer wat er gevraagd wordt in deze repo.

            Dit is een persoonlijke PWA: Vite + React + TypeScript, met een
            module-registry in src/App.tsx. Lees README.md voor de structuur en
            volg de bestaande stijl — zandkleurig palet, hairlines, JetBrains
            Mono, lucide-iconen, geen afgeronde hoeken. Kleuren en maten zijn
            custom properties in src/index.css; gebruik die in plaats van
            nieuwe waarden te verzinnen.

            Blijf bij wat er gevraagd wordt. Deze PR wordt automatisch gemerged
            en uitgerold zodra build en lint slagen, dus er kijkt niemand mee
            voordat het live staat. Geen extra features, geen refactors die er
            niet bij horen, geen afhandeling van situaties die niet kunnen
            voorkomen.

            Werk op een nieuwe branch, commit en push die. Voordat je pusht
            moeten `npm run build` en `npm run lint` allebei slagen — lukt dat
            niet, los het op in plaats van het te melden.

            Open zelf géén pull request en merge niet: de workflow maakt de PR
            aan vanaf jouw branch en mergt hem als build en lint daar ook
            slagen. Zet in je comment op de issue kort wat er veranderd is en
            wat de indiener zelf moet controleren.

            Is het verzoek onduidelijk of te groot voor één keer, push dan
            niets en reageer op de issue met wat je nodig hebt.

      # De PR wordt hier gemaakt, niet door het model. De action heeft een
      # eigen systeemprompt die Claude opdraagt alleen een "Create a PR"-link
      # te geven; of hij die of onze instructie volgt, verschilt per run.
      - name: PR opzoeken of aanmaken
        id: pr
        run: |
          # Label "review" op de issue houdt de merge tegen: de PR wordt wel
          # aangemaakt, maar blijft open zodat je hem eerst kunt bekijken.
          review=$(gh issue view "$ISSUE" --json labels \
            --jq '[.labels[].name] | index("review") != null')
          echo "review=${review}" >> "$GITHUB_OUTPUT"

          find_pr() {
            gh pr list --state open --json number,headRefName \
              --jq "[.[] | select(.headRefName | startswith(\"claude/issue-${ISSUE}-\"))] | first | .number // empty"
          }

          number=$(find_pr)

          if [ -z "${number}" ]; then
            git fetch --quiet origin
            branch=$(git for-each-ref --sort=-committerdate --format='%(refname:short)' \
              "refs/remotes/origin/claude/issue-${ISSUE}-*" | head -n1 | sed 's#^origin/##')

            if [ -z "${branch}" ]; then
              echo "::notice::Claude heeft niets gepusht voor issue #${ISSUE} — zie zijn comment op de issue."
            elif [ "$(git rev-list --count "origin/main..origin/${branch}")" -eq 0 ]; then
              echo "::notice::Branch ${branch} loopt niet voor op main; niets te mergen."
            else
              body=$(printf 'Closes #%s\n\nAangemaakt door de workflow vanaf `%s`. Wat er precies veranderd is, staat in de comment op #%s.' \
                "$ISSUE" "$branch" "$ISSUE")
              gh pr create --base main --head "${branch}" \
                --title "$(gh issue view "$ISSUE" --json title --jq '.title')" \
                --body "${body}"
              number=$(find_pr)
            fi
          fi

          echo "number=${number}" >> "$GITHUB_OUTPUT"

      # De poort staat hier, niet in de prompt: dat het model zegt dat build en
      # lint slagen is geen bewijs. Faalt dit, dan blijft de PR gewoon open.
      - name: Build en lint op de PR
        if: steps.pr.outputs.number != ''
        run: |
          gh pr checkout ${{ steps.pr.outputs.number }}
          npm ci
          npm run build
          npm run lint

      - name: Mergen
        id: merge
        if: steps.pr.outputs.number != '' && steps.pr.outputs.review != 'true'
        run: |
          gh pr merge ${{ steps.pr.outputs.number }} --squash --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Vasthouden voor review
        if: steps.pr.outputs.number != '' && steps.pr.outputs.review == 'true'
        run: |
          gh pr comment ${{ steps.pr.outputs.number }} --body \
            "Niet automatisch gemerged omdat issue #${ISSUE} het label \`review\` heeft. Build en lint slaagden wel. Haal het label weg en label de issue opnieuw met \`enhancement\` om alsnog automatisch te laten lopen, of merge zelf."

      - name: Melden waarom er niet gemerged is
        if: failure() && steps.pr.outputs.number != ''
        run: |
          gh pr comment ${{ steps.pr.outputs.number }} --body \
            "Niet automatisch gemerged: \`npm run build\` of \`npm run lint\` faalde in [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). De PR blijft open."

  # Een merge met GITHUB_TOKEN vuurt geen push-event af dat workflows start,
  # dus deploy.yml komt hier niet vanzelf langs — we roepen Pages zelf aan.
  deploy:
    needs: build-wish
    if: needs.build-wish.outputs.merged == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    uses: ./.github/workflows/pages.yml
    # Expliciet main: de commit die deze run startte is van vóór de merge die
    # een paar stappen eerder plaatsvond, en zou de oude build publiceren.
    with:
      ref: main
